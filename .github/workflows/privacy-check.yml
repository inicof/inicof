name: Public repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check_public_files.py
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: DRBUDGET_DATA_DIR="$RUNNER_TEMP/drbudget-private" sh scripts/setup.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
